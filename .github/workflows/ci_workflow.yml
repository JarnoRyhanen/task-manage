name: CI-Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Linting
        run: npm run lint:${{matrix.target}}
      - name: Run tests
        run: npm run test:${{matrix.target}}
      - name: Build
        run: npm run build:${{matrix.target}}
